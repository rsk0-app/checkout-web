name: ci
'on':
  push:
    branches:
      - main
  pull_request: null
permissions:
  contents: write
  packages: write
jobs:
  build-test:
    runs-on: arc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test
        run: node --test test/*.test.js
  image:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: arc
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/rsk0-app/checkout-web:latest
            ghcr.io/rsk0-app/checkout-web:canary
            ghcr.io/rsk0-app/checkout-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pin chart image.tag to this commit
        id: rsk0_pin
        run: node scripts/rsk0-pin-chart.mjs
      - name: Upload chart commit receipt
        if: steps.rsk0_pin.outputs.receipt_created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rsk0-chart-commit-${{ github.run_attempt }}
          path: chart-commit.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
