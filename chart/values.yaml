replicaCount: 1
image:
  repository: ghcr.io/rsk0-app/checkout-web
  tag: canary
  pullPolicy: Always
service:
  port: 80
  targetPort: 3000
resources:
  limits: {}
  requests:
    cpu: 50m
    memory: 128Mi
env:
  NODE_ENV: production
  CHECKOUT_FEATURE_FLAGS: fast-path
downstream:
  url: http://orders-service-orders-service.rsk0-apps.svc.cluster.local
  timeoutMs: 800
failure:
  mode: crash
  errorRate: "0"
  latencyMs: "0"
