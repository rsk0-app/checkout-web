replicaCount: 2
image:
  repository: ghcr.io/rsk0-app/checkout-web
  tag: ee55bac81b04a88da3854cbc4692acc0d49eb0a0
  pullPolicy: Always
service:
  port: 80
  targetPort: 3000
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
env:
  NODE_ENV: production
  CHECKOUT_FEATURE_FLAGS: fast-path
  # R3: real load-driven memory footprint (MiB). Under loadgen the RSS plateaus
  # at ~this value; the baseline limits.memory (256Mi) sits comfortably above
  # footprint+runtime, so it is healthy at baseline but OOMKilled if a risky
  # change lowers limits.memory below the footprint (set_low_memory_limit -> 128Mi).
  MEM_FOOTPRINT_MB: "150"
database:
  url: postgres://stand:standpass@postgres.rsk0-apps.svc.cluster.local:5432/stand
downstream:
  url: http://orders-service-orders-service.rsk0-apps.svc.cluster.local
  timeoutMs: 800
failure:
  mode: ""
  errorRate: "0"
  latencyMs: "0"
