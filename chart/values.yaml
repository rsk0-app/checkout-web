replicaCount: 1
image:
  repository: ghcr.io/rsk0-app/checkout-web
  tag: canary
  pullPolicy: Always
service:
  port: 80
  targetPort: 3000
resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi
env:
  NODE_ENV: production
  CHECKOUT_FEATURE_FLAGS: fast-path
failure:
  mode: crash
  errorRate: "0"
  latencyMs: "0"
