replicaCount: 1
image:
  repository: ghcr.io/rsk0-app/checkout-web
  tag: canary
  pullPolicy: Always
service:
  port: 80
  targetPort: 3000
resources:
  limits: {}
  requests:
    cpu: 50m
    memory: 128Mi
env:
  NODE_ENV: production
  CHECKOUT_FEATURE_FLAGS: fast-path
# R1: real downstream dependency (checkout-web -> orders-service). A downstream
# failure makes business requests 502 and flips readiness -> real blast-radius.
downstream:
  url: "http://orders-service-orders-service.rsk0-apps.svc.cluster.local"
  timeoutMs: 800
failure:
  mode: ""
  errorRate: "0"
  latencyMs: "0"
